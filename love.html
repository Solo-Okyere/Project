<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for You</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@200;400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0a1a 0%, #050505 100%);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #fce4ec;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 80%;
            pointer-events: auto;
            transition: all 1.5s ease;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #ff8fa3;
            opacity: 0;
            transition: opacity 2s ease;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            letter-spacing: 1px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 2s ease 1s;
        }

        .prompt-btn {
            background: transparent;
            border: 1px solid #ff8fa3;
            color: #ff8fa3;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: 0.3s;
            pointer-events: auto;
        }

        .prompt-btn:hover {
            background: #ff8fa3;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 143, 163, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .visible {
            opacity: 1 !important;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="step-1" class="glass-card">
            <button class="prompt-btn" onclick="startExperience()">A message for you...</button>
        </div>

        <div id="step-2" class="glass-card hidden">
            <h1 id="name">Her Name</h1>
            <p id="valentine-text">
                Every heart finds its own rhythm, and I am grateful for the chance to listen to yours. 
                Whether in silence or in song, I choose to stand by you—not because I am waiting for an answer, 
                but because I appreciate the person you are right now. 
                <br><br>
                Happy Valentine's Day.
            </p>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationActive = false;

        // --- Change her name here ---
        const herName = "Grace"; 
        document.getElementById('name').innerText = herName;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.angle = Math.random() * Math.PI * 2;
                this.velocity = 0.02 + Math.random() * 0.02;
                this.color = `rgba(255, ${140 + Math.random() * 50}, ${160 + Math.random() * 50}, ${Math.random() * 0.8})`;
            }

            update(targetX, targetY, isHeart) {
                if (isHeart) {
                    const dx = targetX - this.x;
                    const dy = targetY - this.y;
                    this.x += dx * this.velocity;
                    this.y += dy * this.velocity;
                } else {
                    this.x += this.speedX;
                    this.y += this.speedY;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createHeartPoints() {
            const points = [];
            const scale = Math.min(canvas.width, canvas.height) / 25;
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                // Heart Equation
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                points.push({
                    x: x * scale + canvas.width / 2,
                    y: y * scale + canvas.height / 2 - 50
                });
            }
            return points;
        }

        function init() {
            particles = [];
            for (let i = 0; i < 600; i++) {
                particles.push(new Particle());
            }
        }

        const heartPoints = createHeartPoints();

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, i) => {
                if (animationActive) {
                    const target = heartPoints[i % heartPoints.length];
                    p.update(target.x, target.y, true);
                } else {
                    p.update();
                }
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        function startExperience() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            
            setTimeout(() => {
                document.getElementById('name').classList.add('visible');
                document.getElementById('valentine-text').classList.add('visible');
                animationActive = true;
            }, 500);
        }

        init();
        animate();
    </script>
</body>
</html>
